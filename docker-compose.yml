# pahe-watcher — Docker Compose for the watcher + web GUI.
#
#   docker compose up -d --build
#
# Put your Google service-account key at ./credentials/google-service-account.json
# and your settings in a .env file (see .env.example).
services:
  watcher:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: pahe-watcher:latest
    container_name: pahe-watcher
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8787}:8787"
    volumes:
      - watcher-data:/data
      - ./credentials:/app/credentials:ro
    # For MANUAL captcha solving the container itself needs no display at
    # all: set BYPASS_CDP_ENABLED=true and BYPASS_CDP_URL in .env to point
    # at a real Chrome the operator runs on their own PC
    # (--remote-debugging-port=9222) — every browser this app drives,
    # including the intercelestial/oii.la isolated resolvers, connects to
    # that remote Chrome instead of launching one in the container. Full
    # setup: cdp_feature.md. Alternatively, for fully unattended operation
    # with no human ever solving a captcha, use CAPTCHA_PROVIDER=2captcha
    # and leave BYPASS_CDP_ENABLED=false (BROWSER_MODE stays headless).

  # ── Optional: MCP server (next phase) ──
  # mcp:
  #   build: { context: ., dockerfile: docker/Dockerfile }
  #   command: ["node", "src/mcp/server.js"]
  #   env_file: [.env]
  #   volumes:
  #     - watcher-data:/data
  #     - ./credentials:/app/credentials:ro

volumes:
  watcher-data:
